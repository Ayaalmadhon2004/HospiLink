name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in as a nurse\n2. Open Beds\n3. ..."
    validations:
      required: true
  - type: input
    id: role
    attributes:
      label: Role and area
      placeholder: "Admin, Pharmacy"
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "Browser, OS, local or live demo, language (EN/AR)"
