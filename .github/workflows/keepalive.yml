name: keepalive

# Render's free tier puts the API to sleep after ~15 minutes without traffic; this pings the
# health endpoint every 10 minutes so the first real request does not hit a cold start.
#
# Setup (repository owner): Settings -> Secrets and variables -> Actions -> Variables -> New repository variable
#   API_HEALTH_URL = https://hospilink-1bfi.onrender.com/api/health
# Without the variable the job only prints a notice and succeeds. No secrets are used.
#
# Caveat: GitHub may delay scheduled runs under load, and disables scheduled workflows in a
# repository with no activity for 60 days (re-enable them in the Actions tab).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health endpoint
        env:
          API_HEALTH_URL: ${{ vars.API_HEALTH_URL }}
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "::notice::API_HEALTH_URL repository variable is not set; skipping keepalive."
            exit 0
          fi
          curl -fsS -m 60 --retry 2 -o /dev/null "$API_HEALTH_URL"
          echo "API is up."
