name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# لو صار في أكتر من push بفترة قصيرة، بلغي التشغيل القديم وخلي الجديد بس يشتغل
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # 1) Backend: install -> prisma generate -> lint -> build -> test
  # ---------------------------------------------------------
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          # prisma.config.ts requires DATABASE_URL; a dummy value is enough for generate
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      # The backend has no lint script, so there is no lint step here.

      - name: Build (TypeScript)
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: test-secret
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

  # ---------------------------------------------------------
  # 2) Frontend: install -> lint -> build -> test
  #    (النشر نفسه محلول عند Vercel تلقائياً عند الـ push لـ main)
  # ---------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # ---------------------------------------------------------
  # 3) Deploy الـ backend على Render
  #    بيشتغل بس لما الـ push يكون على main وكل الفحوصات فوق نجحت
  # ---------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # No prisma/migrations folder yet (schema is applied with `prisma db push`),
      # so there is nothing for CI to migrate. Add a migrate step once migrations exist.

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set; skipping (Render auto-deploys from main)."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
