name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# لو صار في أكتر من push بفترة قصيرة، بلغي التشغيل القديم وخلي الجديد بس يشتغل
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # 1) Backend: install -> prisma generate -> lint -> build -> test
  # ---------------------------------------------------------
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          # prisma.config.ts requires DATABASE_URL; a dummy value is enough for generate
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

      - name: Lint
        run: npm run lint

      - name: Build (TypeScript)
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: test-secret
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

  # ---------------------------------------------------------
  # 2) Frontend: install -> lint -> build -> test
  #    (النشر نفسه محلول عند Vercel تلقائياً عند الـ push لـ main)
  # ---------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (mocked API)
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  # ---------------------------------------------------------
  # 2b) Real-backend E2E: Playwright -> built frontend -> real API -> throwaway PostgreSQL.
  #     Separate job (the mocked E2E stays in frontend-ci). See docs/E2E_REAL.md.
  # ---------------------------------------------------------
  e2e-real:
    name: E2E (real backend + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for a container that lives only for this job.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospilink_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hospilink_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospilink_e2e
      # Throwaway value, not a real secret.
      E2E_JWT_SECRET: ci-e2e-throwaway-jwt-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The Playwright config applies `prisma migrate deploy`, seeds backend/prisma/seed.e2e.ts
      # and starts the API and the built frontend itself.
      - name: Run real-backend E2E tests
        run: npm run test:e2e:real
        working-directory: frontend

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-real
          path: frontend/test-results-real
          if-no-files-found: ignore

  # ---------------------------------------------------------
  # 2b) Backend integration: real PostgreSQL, real Prisma, real triggers/constraints, real socket.io server.
  #     Catches what the mocked unit suite cannot (races, DB-level guards, tenant leaks). See docs/INTEGRATION_TESTS.md.
  # ---------------------------------------------------------
  backend-integration:
    name: Backend integration (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for a container that lives only for this job.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospilink_inttest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hospilink_inttest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospilink_inttest
      # Throwaway value, not a real secret.
      JWT_SECRET: ci-int-throwaway-jwt-secret
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.INT_DATABASE_URL }}

      # The migrations are applied by the suite's global setup; right after that the database must match schema.prisma
      # exactly: a schema change without a migration (or the reverse) fails here instead of in production.
      - name: Apply migrations and check for schema drift
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_URL: ${{ env.INT_DATABASE_URL }}

      - name: Run integration tests
        run: npm run test:int

  # ---------------------------------------------------------
  # 3) Deploy الـ backend على Render
  #    بيشتغل بس لما الـ push يكون على main وكل الفحوصات فوق نجحت
  # ---------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [backend-ci, backend-integration, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Apply pending Prisma migrations to production BEFORE triggering the deploy, so new code
      # never starts against an older schema. If this step fails the job stops and nothing is deployed.
      # MIGRATE_DATABASE_URL lives in the `production` environment secrets; use Neon's direct
      # (non-pooled) connection string for it. It is only passed through env, never printed.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Apply database migrations
        env:
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          if [ -z "$MIGRATE_DATABASE_URL" ]; then
            echo "::warning::MIGRATE_DATABASE_URL secret is not set; skipping migrations. Run 'npx prisma migrate deploy' manually (docs/MIGRATIONS.md)."
            exit 0
          fi
          DATABASE_URL="$MIGRATE_DATABASE_URL" npx prisma migrate deploy
        working-directory: backend

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not set; skipping (Render auto-deploys from main)."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
