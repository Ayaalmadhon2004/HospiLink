name: ZAP baseline

# OWASP ZAP passive baseline against a locally started API (throwaway Postgres) and the built frontend served with the
# headers from frontend/vercel.json. Manual + weekly; not a PR gate. See docs/SECURITY_SCANNING.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.1
  API_PORT: "5000"
  WEB_PORT: "4173"

jobs:
  zap:
    name: ZAP baseline (API + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospilink_zaptest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hospilink_zaptest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install, migrate, seed, start
        working-directory: backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx tsx prisma/seed.e2e.ts
          NODE_ENV=production PORT=$API_PORT JWT_SECRET=zap-only-$(openssl rand -hex 24) \
            CORS_ORIGINS=http://localhost:$WEB_PORT LOG_LEVEL=error nohup npx tsx src/server.ts > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:$API_PORT/api/health && break; sleep 2; done

      - name: Frontend - build and serve with vercel.json headers
        working-directory: frontend
        run: |
          npm ci
          VITE_API_URL=http://localhost:$API_PORT/api npm run build
          nohup node ../.zap/serve-frontend.mjs dist vercel.json $WEB_PORT > ../web.log 2>&1 &
          for i in $(seq 1 15); do curl -sf http://localhost:$WEB_PORT/ >/dev/null && break; sleep 1; done

      - name: ZAP baseline - API
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk/.zap:ro" -v "$PWD/zap-out:/zap/wrk:rw" \
            $ZAP_IMAGE zap-baseline.py -t http://localhost:$API_PORT/api/health -c .zap/rules.tsv \
            -J api.json -r api.html -I
        # -I: do not fail the step on warnings; rules.tsv FAIL entries still exit 1 below.
        continue-on-error: true
        id: api

      - name: ZAP baseline - frontend
        run: |
          docker run --rm --network host -v "$PWD/.zap:/zap/wrk/.zap:ro" -v "$PWD/zap-out:/zap/wrk:rw" \
            $ZAP_IMAGE zap-baseline.py -t http://localhost:$WEB_PORT/ -c .zap/rules.tsv \
            -J web.json -r web.html -I
        continue-on-error: true
        id: web

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: zap-out/
          retention-days: 30

      - name: Fail on FAIL-level findings
        if: steps.api.outcome == 'failure' || steps.web.outcome == 'failure'
        run: |
          echo "ZAP reported FAIL-level alerts (see the zap-reports artifact)."
          exit 1
