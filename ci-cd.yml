name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# لو صار في أكتر من push بفترة قصيرة، بلغي التشغيل القديم وخلي الجديد بس يشتغل
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------
  # 1) Backend: install -> prisma generate -> lint -> build -> test
  # ---------------------------------------------------------
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Build (TypeScript)
        run: npm run build --if-present

      - name: Run tests (if configured)
        run: npm test --if-present
        env:
          # هاد سيكرت اختياري، بيتستخدم بس إذا التيستات محتاجة قاعدة بيانات
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  # ---------------------------------------------------------
  # 2) Frontend: install -> lint -> build -> test
  #    (النشر نفسه محلول عند Vercel تلقائياً عند الـ push لـ main)
  # ---------------------------------------------------------
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Run tests (if configured)
        run: npm test --if-present

  # ---------------------------------------------------------
  # 3) تأكيد إن الـ Docker images بتبني منيح (فحص فقط، بدون نشر)
  # ---------------------------------------------------------
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: hospilink-backend:ci

      - name: Validate docker-compose config
        run: docker compose config

  # ---------------------------------------------------------
  # 4) Deploy الـ backend على Render
  #    بيشتغل بس لما الـ push يكون على main وكل الفحوصات فوق نجحت
  # ---------------------------------------------------------
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: [docker-build-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run database migrations (Prisma)
        working-directory: backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret مش مضاف، بلش أضيفه من إعدادات الريبو." >&2
            exit 1
          fi
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
